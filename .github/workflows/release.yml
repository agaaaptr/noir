name: Release

# Publishes the @noir-ai/* workspace packages to npm (unified version, on a git tag).
# Auth = npm automation token (the NPM_TOKEN repo secret — a granular publish-only
# token created once on npm). Every publish ALSO carries a SLSA provenance
# attestation (--provenance), which uses GitHub OIDC (the `id-token: write`
# permission) independent of the publish token. See docs/releasing.md §1.
#
# CHANNEL = branch-based (two channels only: beta + stable):
#   - tag on `main`    → dist-tag `latest` (stable). `npm i @noir-ai/cli` gets it.
#   - tag on `develop` → dist-tag `beta`.   `npm i @noir-ai/cli@beta` to opt in.
# The publish job derives the channel from which branch holds the tagged commit.
#
# Cut a release:
#   beta:    node scripts/bump-version.mjs 1.0.0-beta.1 && commit && tag v1.0.0-beta.1 (on develop)
#   stable:  merge develop→main, node scripts/bump-version.mjs 1.0.0 && commit && tag v1.0.0 (on main)
#   then:    git push --tags

on:
  push:
    tags:
      - "v*"

# Never run two publishes for the same tag; a new tag push cancels the in-flight one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `id-token: write` is REQUIRED for npm OIDC Trusted Publishing + provenance.
# `contents: read` is enough to read the tagged source (the bump commit is already pushed).
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Build + test (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # pnpm version comes from package.json `packageManager` (single source — v4 errors if `version:` is also set here)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build BEFORE typecheck: each package's exports/types point at ./dist/*.d.ts,
      # so tsc can't resolve inter-package imports until the dist artifacts exist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    name: Publish @noir-ai/* (unified, provenance; main=stable, develop=beta)
    needs: verify
    runs-on: ubuntu-latest
    # `release` is the environment linked on npm as the Trusted Publisher.
    # Add a required reviewer here on GitHub to require human approval before publish.
    environment: release
    steps:
      # fetch-depth: 0 so we can determine which branch holds the tagged commit (the channel).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6  # pnpm version comes from package.json `packageManager` (single source — v4 errors if `version:` is also set here)
      # `registry-url` + the NPM_TOKEN env (in the publish step) wire npm auth:
      # setup-node writes an .npmrc that publishes to the registry using
      # NODE_AUTH_TOKEN. The granular token is created once on npm + stored as the
      # NPM_TOKEN repo secret (docs/releasing.md §1). Provenance (--provenance) is
      # separate — it uses the GitHub OIDC token from the `id-token: write` permission.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Determine release channel (tag on main → latest/stable; else → beta)
        id: channel
        run: |
          set -e
          SHA="${{ github.sha }}"
          # `git branch -r --contains` lists remote branches holding the tagged commit.
          if git branch -r --contains "$SHA" 2>/dev/null | grep -q 'origin/main'; then
            echo "tag=latest"   >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "Channel: STABLE (npm dist-tag: latest — 'npm i @noir-ai/cli' resolves here)."
          else
            echo "tag=beta"   >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "Channel: BETA (npm dist-tag: beta — 'npm i @noir-ai/cli@beta' to opt in)."
          fi

      - name: Pack all workspace packages (pnpm rewrites workspace:* ranges into the tarballs)
        # pnpm pack (NOT npm pack) rewrites workspace:* → concrete versions, so the
        # published packages resolve on install. `npm publish` does NOT rewrite workspace
        # ranges, and `pnpm publish` does NOT support --provenance — so we PACK with pnpm
        # (correct deps) then PUBLISH the tarballs with npm (which adds the provenance attestation).
        run: pnpm -r --filter './packages/*' pack --pack-destination artifacts

      - name: Publish the packed tarballs (npm publish --provenance, NPM_TOKEN)
        env:
          DIST_TAG: ${{ steps.channel.outputs.tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then echo "NPM_TOKEN secret is not set — see docs/releasing.md §1"; exit 1; fi
          echo "Publishing with npm dist-tag: $DIST_TAG"
          mapfile -d '' tarballs < <(find artifacts -type f -name '*.tgz' -print0)
          if [ "${#tarballs[@]}" -eq 0 ]; then echo "No tarballs found"; exit 1; fi
          for tgz in "${tarballs[@]}"; do
            echo "Publishing $tgz (dist-tag: $DIST_TAG)"
            npm publish "./$tgz" --provenance --access public --tag "$DIST_TAG"
          done
