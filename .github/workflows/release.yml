name: Release

# Publishes the 10 @noir-ai/* packages to npm (unified version, on a git tag).
# Auth = OIDC Trusted Publishing (tokenless): npm trusts this repo + workflow
# (see docs/releasing.md §1). No NPM_TOKEN secret. Every publish carries a SLSA
# provenance attestation (--provenance).
#
# CHANNEL = branch-based (two channels only: beta + stable):
#   - tag on `main`    → dist-tag `latest` (stable). `npm i @noir-ai/cli` gets it.
#   - tag on `develop` → dist-tag `beta`.   `npm i @noir-ai/cli@beta` to opt in.
# The publish job derives the channel from which branch holds the tagged commit.
#
# Cut a release:
#   beta:    node scripts/bump-version.mjs 1.0.0-beta.1 && commit && tag v1.0.0-beta.1 (on develop)
#   stable:  merge develop→main, node scripts/bump-version.mjs 1.0.0 && commit && tag v1.0.0 (on main)
#   then:    git push --tags

on:
  push:
    tags:
      - "v*"

# Never run two publishes for the same tag; a new tag push cancels the in-flight one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# `id-token: write` is REQUIRED for npm OIDC Trusted Publishing + provenance.
# `contents: read` is enough to read the tagged source (the bump commit is already pushed).
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    name: Build + test (tag ${{ github.ref_name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test

  publish:
    name: Publish @noir-ai/* (unified, provenance; main=stable, develop=beta)
    needs: verify
    runs-on: ubuntu-latest
    # `release` is the environment linked on npm as the Trusted Publisher.
    # Add a required reviewer here on GitHub to require human approval before publish.
    environment: release
    steps:
      # fetch-depth: 0 so we can determine which branch holds the tagged commit (the channel).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # NOTE: no `registry-url` / no NODE_AUTH_TOKEN. With Trusted Publishing,
      # `npm publish --provenance` exchanges the GitHub OIDC token for a
      # short-lived publish credential; an explicit .npmrc token line would
      # shadow that flow. Node 22 ships npm 10+, which supports this.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Determine release channel (tag on main → latest/stable; else → beta)
        id: channel
        run: |
          set -e
          SHA="${{ github.sha }}"
          # `git branch -r --contains` lists remote branches holding the tagged commit.
          if git branch -r --contains "$SHA" 2>/dev/null | grep -q 'origin/main'; then
            echo "tag=latest"   >> "$GITHUB_OUTPUT"
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "Channel: STABLE (npm dist-tag: latest — 'npm i @noir-ai/cli' resolves here)."
          else
            echo "tag=beta"   >> "$GITHUB_OUTPUT"
            echo "channel=beta" >> "$GITHUB_OUTPUT"
            echo "Channel: BETA (npm dist-tag: beta — 'npm i @noir-ai/cli@beta' to opt in)."
          fi

      - name: Publish all 10 packages (npm publish --provenance --tag <channel>)
        env:
          DIST_TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -e
          echo "Publishing with npm dist-tag: $DIST_TAG"
          pnpm -r --filter './packages/*' exec npm publish --provenance --access public --tag "$DIST_TAG"
