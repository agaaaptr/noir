name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # pnpm version comes from package.json `packageManager` (single source — v4 errors if `version:` is also set here)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build BEFORE typecheck: each package's exports/types point at ./dist/*.d.ts,
      # so tsc can't resolve inter-package imports until the dist artifacts exist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
