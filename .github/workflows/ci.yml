name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu + macOS only. Windows is EXCLUDED from the verify matrix because
        # better-sqlite3@13.0.1 is source-only (node-gyp rebuild, no prebuilt
        # binaries), and node-gyp@11.1.0 cannot detect Visual Studio 18 (the
        # 2026 version shipped on windows-latest runners) — its version map
        # only goes up to VS 17 (2022). This is a node-gyp infrastructure issue,
        # not a Noir code defect. Windows is NOT covered by CI anywhere (the
        # install/provision smoke jobs below also exclude it) — Windows coverage
        # is manual. The one POSIX-only unit test (chmod-based degraded store
        # open) skips.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6  # pnpm version comes from package.json `packageManager` (single source — v4 errors if `version:` is also set here)
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Build BEFORE typecheck: each package's exports/types point at ./dist/*.d.ts,
      # so tsc can't resolve inter-package imports until the dist artifacts exist.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Validate documentation: broken links, stale version refs, registry integrity.
      - run: pnpm docs:validate

  # ── C1: install smoke test ───────────────────────────────────
  # Runs the REAL installers (scripts/install.sh on posix, install.ps1 on
  # Windows) against the published @noir-ai/cli@latest, then asserts
  # `noir --version` + `noir doctor` work. This is an ONLINE job (it installs
  # from npm) — that's why it lives in CI, never in the offline unit suite.
  # It verifies the INSTALLER WIRING cross-platform, not a specific commit's
  # bits (the version on npm may lag the commit under test). `needs: verify`
  # gates it on the offline gate passing first.
  install-smoke:
    name: Install smoke (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # WINDOWS EXCLUDED: better-sqlite3@13 source-only (needs VS Build Tools on runner)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # No pnpm needed — the installer uses system npm.

      - name: Run installer
        shell: bash
        run: |
          set -e
          bash scripts/install.sh

      - name: Verify noir --version + noir doctor
        shell: bash
        run: |
          set -e
          # The managed-Node installer writes the noir shim at ~/.noir/bin/noir
          # (POSIX) or ~/.noir/bin/noir.cmd (Windows) — not the npm global bin.
          # Surface it on every OS for this step only.
          export PATH="$HOME/.noir/bin:$PATH"
          echo "::group::noir --version"
          noir --version
          echo "::endgroup::"
          # `noir doctor` exits 1 ONLY on a CRITICAL (fail) check. On a fresh
          # global install (no .noir/ in the runner's cwd) every project-
          # dependent check warns+skips and native deps are loadable, so the
          # exit code is 0 — proving the binary + native bindings work on this OS.
          echo "::group::noir doctor"
          noir doctor || { echo "noir doctor exited $?" && exit 1; }
          echo "::endgroup::"

  # ── C1/P5: managed-Node provision smoke ───────────────────────
  # This is the ONLY job where the REAL Node 22 LTS download runs (the unit
  # suite mocks the fetch/extract; install-smoke above installs from npm and
  # falls back to the system Node). It runs scripts/install.sh / install.ps1
  # from a CLEAN env — no system Node/npm on PATH where feasible — then asserts
  # the provisioned managed runtime exists at ~/.noir/runtime/v<ver>/bin/node
  # and that `noir --version` resolves through it. ONLINE by design (downloads
  # nodejs.org), so it lives in CI only. `needs: verify` gates it on the
  # offline gate passing first.
  node-provision-smoke:
    name: Node provision smoke (${{ matrix.os }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]  # WINDOWS EXCLUDED: better-sqlite3@13 source-only (needs VS Build Tools on runner)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Provision + install from a clean env
        shell: bash
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          set -e
          echo "node on PATH: $(command -v node || echo '<none>')"
          echo "npm on PATH:  $(command -v npm || echo '<none>')"
          echo "::group::install.sh (clean env)"
          bash scripts/install.sh
          echo "::endgroup::"

      - name: Assert managed runtime + noir --version
        shell: bash
        run: |
          set -e
          . ./scripts/node-version.env
          VER="$MANAGED_NODE_VERSION"
          echo "pinned MANAGED_NODE_VERSION: $VER"
          NODE_BIN="$HOME/.noir/runtime/v${VER}/bin/node"
          # Both installers write the noir shim to ~/.noir/bin (noir.cmd on
          # Windows); on this clean env there is no npm-global noir on PATH, so
          # surface the shim dir on every OS.
          export PATH="$HOME/.noir/bin:$PATH"
          echo "::group::managed runtime assertion"
          test -x "$NODE_BIN" && echo "OK: $NODE_BIN is executable"
          "$NODE_BIN" --version
          echo "::endgroup::"
          echo "::group::noir --version"
          export PATH="$HOME/.noir/bin:$PATH"
          noir --version
          echo "::endgroup::"
          echo "::group::noir runs on the provisioned node"
          grep -F "$HOME/.noir/runtime/v${VER}/bin/node" "$HOME/.noir/bin/noir" \
            && echo "OK: noir shim is wired to the managed node"
          echo "::endgroup::"
